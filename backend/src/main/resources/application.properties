spring.application.name=hospital-opd

# MongoDB Configuration
# Use a cloud URI (like MongoDB Atlas) in production via the environment variable
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/hospital_db}

# Server Configuration
# Cloud platforms like Render/Railway automatically set the PORT environment variable
server.port=${PORT:8081}

# CORS Configuration
# Allows communication between your Vercel frontend and this backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,https://*.vercel.app}

# JWT Secret
# Set this in your hosting platform's environment variables
app.jwt.secret=${APP_JWT_SECRET:very-secret-key-change-this-in-production-at-least-32-chars}

# Health Check & Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
